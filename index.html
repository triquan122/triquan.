<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quest - Millionaire Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Styles */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.2);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #00f5ff;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Main Container with Sidebar */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            gap: 30px;
        }

        /* Level Ladder Sidebar */
        .level-ladder {
            width: 280px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .ladder-title {
            text-align: center;
            font-size: 1.3em;
            color: #00f5ff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .ladder-item {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ladder-item.current {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.3), rgba(0, 245, 255, 0.3));
            border-color: #00f5ff;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 245, 255, 0.5); }
            50% { box-shadow: 0 0 30px rgba(0, 245, 255, 0.8); }
        }

        .ladder-item.completed {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        .ladder-item.milestone {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
        }

        .ladder-item.milestone.completed {
            background: rgba(255, 193, 7, 0.3);
            border-color: #ffc107;
        }

        .ladder-level {
            font-weight: bold;
            color: #00f5ff;
        }

        .ladder-reward {
            color: #ffd700;
            font-size: 0.9em;
        }

        .ladder-icon {
            font-size: 1.2em;
            margin-left: 10px;
        }

        /* Game Container */
        .game-container {
            flex: 1;
            max-width: 900px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .question-number {
            color: #a855f7;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #00f5ff;
            font-weight: 600;
        }

        .question-example {
            font-size: 1em;
            color: #ccc;
            font-style: italic;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ffbe0b);
            transition: width 0.1s linear;
        }

        /* Answer Options */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .answer-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00f5ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .answer-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .answer-btn:active {
            transform: translateY(-1px);
        }

        .answer-btn.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            animation: correct-flash 0.5s ease;
        }

        .answer-btn.wrong {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        @keyframes correct-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Feedback */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        .feedback-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 2em;
            margin-bottom: 15px;
            color: #00f5ff;
        }

        .feedback-text {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .continue-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        /* Start Screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .start-content {
            text-align: center;
            padding: 40px;
        }

        .start-title {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-subtitle {
            font-size: 1.5em;
            color: #ccc;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 20px 60px;
            border-radius: 15px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 255, 255, 0.5);
        }

        /* Particles Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f5ff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 6s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column-reverse;
            }
            
            .level-ladder {
                width: 100%;
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }
            .question-text {
                font-size: 1.3em;
            }
            .answers-grid {
                grid-template-columns: 1fr;
            }
            .start-title {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h1 class="start-title">🎮 ENGLISH MILLIONAIRE</h1>
            <p class="start-subtitle">Ai là triệu phú tiếng Anh?</p>
            <button class="start-btn" onclick="startGame()">BẮT ĐẦU THÁCH ĐẤU</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="game-title">💰 ENGLISH MILLIONAIRE</h1>
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">Câu hỏi hiện tại</div>
                <div class="stat-value" id="currentLevel">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Tổng điểm</div>
                <div class="stat-value" id="totalScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Lần chơi tốt nhất</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Level Ladder -->
        <aside class="level-ladder">
            <div class="ladder-title">🏆 THANG ĐIỂM</div>
            <div id="ladderItems"></div>
        </aside>

        <!-- Game Container -->
        <main class="game-container">
            <div class="question-card" id="questionCard">
                <div class="question-number" id="questionNumber">Câu hỏi 1</div>
                <div class="question-text" id="questionText">Loading...</div>
                <div class="question-example" id="questionExample"></div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill" style="width: 100%"></div>
                </div>
                <div class="answers-grid" id="answersGrid"></div>
            </div>
        </main>
    </div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <div class="feedback-icon" id="feedbackIcon">✅</div>
            <div class="feedback-title" id="feedbackTitle">Chính xác!</div>
            <div class="feedback-text" id="feedbackText"></div>
            <button class="continue-btn" onclick="handleFeedbackAction()">Tiếp tục</button>
        </div>
    </div>

    <script>
        // ==================== GAME DATA ====================
        const vocabulary = [
            { word: "achievement", meaning: "thành tựu", example: "Winning the race was a great achievement.", level: 1 },
            { word: "approach", meaning: "tiếp cận, phương pháp", example: "We need a new approach to solve this problem.", level: 1 },
            { word: "benefit", meaning: "lợi ích", example: "Exercise has many health benefits.", level: 1 },
            { word: "challenge", meaning: "thử thách", example: "Learning a new language is a big challenge.", level: 1 },
            { word: "contribute", meaning: "đóng góp", example: "Everyone should contribute to the project.", level: 2 },
            { word: "decrease", meaning: "giảm", example: "The temperature will decrease tonight.", level: 2 },
            { word: "environment", meaning: "môi trường", example: "We must protect the environment.", level: 2 },
            { word: "furthermore", meaning: "hơn nữa", example: "The plan is expensive; furthermore, it's risky.", level: 2 },
            { word: "impact", meaning: "tác động", example: "Technology has a huge impact on our lives.", level: 3 },
            { word: "maintain", meaning: "duy trì", example: "It's important to maintain good health.", level: 3 },
            { word: "opportunity", meaning: "cơ hội", example: "This job is a great opportunity.", level: 3 },
            { word: "participate", meaning: "tham gia", example: "All students should participate in class.", level: 3 },
            { word: "requirement", meaning: "yêu cầu", example: "What are the requirements for this course?", level: 4 },
            { word: "significant", meaning: "đáng kể", example: "There has been significant progress.", level: 4 },
            { word: "strategy", meaning: "chiến lược", example: "We need a better marketing strategy.", level: 4 },
            { word: "emphasize", meaning: "nhấn mạnh", example: "The teacher emphasized the importance of practice.", level: 5 },
            { word: "enhance", meaning: "nâng cao", example: "This will enhance your skills.", level: 5 },
            { word: "perspective", meaning: "góc nhìn", example: "Try to see things from a different perspective.", level: 5 },
            { word: "accomplish", meaning: "hoàn thành", example: "We accomplished our goal ahead of schedule.", level: 4 },
            { word: "particular", meaning: "cụ thể, đặc biệt", example: "This particular problem needs attention.", level: 3 },
        ];

        // Level rewards (Millionaire-style)
        const levelRewards = [
            { level: 1, reward: "100", milestone: false },
            { level: 2, reward: "200", milestone: false },
            { level: 3, reward: "500", milestone: false },
            { level: 4, reward: "1,000", milestone: false },
            { level: 5, reward: "2,000", milestone: true },  // Safe point
            { level: 6, reward: "5,000", milestone: false },
            { level: 7, reward: "10,000", milestone: false },
            { level: 8, reward: "25,000", milestone: false },
            { level: 9, reward: "50,000", milestone: false },
            { level: 10, reward: "100,000", milestone: true }, // Winner!
        ];

        // ==================== GAME STATE ====================
        let gameState = {
            currentLevel: 1,
            totalScore: 0,
            bestScore: 0,
            currentQuestion: null,
            usedQuestions: [],
            timer: null,
            timeLeft: 30,
            isWrong: false
        };

        // Load saved game state
        function loadGameState() {
            const saved = localStorage.getItem('englishMillionaireSave');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.bestScore = data.bestScore || 0;
            }
        }

        // Save game state
        function saveGameState() {
            const toSave = {
                bestScore: gameState.bestScore
            };
            localStorage.setItem('englishMillionaireSave', JSON.stringify(toSave));
        }

        // ==================== INITIALIZE ====================
        function init() {
            createParticles();
            loadGameState();
            createLadder();
            updateUI();
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }

        // Create level ladder
        function createLadder() {
            const container = document.getElementById('ladderItems');
            container.innerHTML = '';
            
            // Reverse order (10 to 1)
            for (let i = levelRewards.length - 1; i >= 0; i--) {
                const item = levelRewards[i];
                const div = document.createElement('div');
                div.className = 'ladder-item';
                if (item.milestone) div.classList.add('milestone');
                div.id = `ladder-${item.level}`;
                
                div.innerHTML = `
                    <span class="ladder-level">Câu ${item.level}</span>
                    <span class="ladder-reward">${item.reward} điểm</span>
                    <span class="ladder-icon"></span>
                `;
                
                container.appendChild(div);
            }
        }

        // Update ladder UI
        function updateLadder() {
            levelRewards.forEach(item => {
                const element = document.getElementById(`ladder-${item.level}`);
                element.classList.remove('current', 'completed');
                
                if (item.level < gameState.currentLevel) {
                    element.classList.add('completed');
                    element.querySelector('.ladder-icon').textContent = '✓';
                } else if (item.level === gameState.currentLevel) {
                    element.classList.add('current');
                    element.querySelector('.ladder-icon').textContent = '👉';
                } else {
                    element.querySelector('.ladder-icon').textContent = '';
                }
            });
        }

        // ==================== GAME FLOW ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            resetGame();
            loadQuestion();
        }

        function resetGame() {
            gameState.currentLevel = 1;
            gameState.totalScore = 0;
            gameState.usedQuestions = [];
            gameState.isWrong = false;
            updateUI();
            updateLadder();
        }

        function loadQuestion() {
            // Get available questions
            const available = vocabulary.filter(q => !gameState.usedQuestions.includes(q.word));
            
            if (available.length === 0) {
                gameState.usedQuestions = [];
                loadQuestion();
                return;
            }

            // Select random question
            const question = available[Math.floor(Math.random() * available.length)];
            gameState.currentQuestion = question;
            gameState.usedQuestions.push(question.word);

            // Generate wrong answers
            const wrongAnswers = vocabulary
                .filter(v => v.word !== question.word)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(v => v.meaning);

            // Create answer options
            const answers = [...wrongAnswers, question.meaning].sort(() => Math.random() - 0.5);

            // Update UI
            document.getElementById('questionNumber').textContent = `Câu hỏi ${gameState.currentLevel} / 10`;
            document.getElementById('questionText').textContent = question.word;
            document.getElementById('questionExample').textContent = `"${question.example}"`;

            // Render answers
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            answers.forEach(answer => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => checkAnswer(answer);
                grid.appendChild(btn);
            });

            // Start timer
            startTimer();
        }

        function startTimer() {
            gameState.timeLeft = 30;
            const timerFill = document.getElementById('timerFill');
            
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.timeLeft -= 0.1;
                const percentage = (gameState.timeLeft / 30) * 100;
                timerFill.style.width = percentage + '%';

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    checkAnswer(null); // Time's up
                }
            }, 100);
        }

        function checkAnswer(answer) {
            clearInterval(gameState.timer);
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.onclick = null);

            const correct = answer === gameState.currentQuestion.meaning;

            if (correct) {
                // Highlight correct button
                buttons.forEach(btn => {
                    if (btn.textContent === answer) {
                        btn.classList.add('correct');
                    }
                });

                // Add score
                const reward = parseInt(levelRewards[gameState.currentLevel - 1].reward.replace(/,/g, ''));
                gameState.totalScore += reward;

                // Check if won
                if (gameState.currentLevel === 10) {
                    gameState.isWrong = false;
                    setTimeout(() => {
                        showFeedback(
                            '🎉',
                            'CHIẾN THẮNG!',
                            `Chúc mừng! Bạn đã chinh phục 10 câu hỏi!\nTổng điểm: ${gameState.totalScore.toLocaleString()} điểm`
                        );
                    }, 800);
                } else {
                    setTimeout(() => {
                        showFeedback(
                            '✅',
                            'Chính xác!',
                            `+${reward.toLocaleString()} điểm\n"${gameState.currentQuestion.word}" nghĩa là "${gameState.currentQuestion.meaning}"`
                        );
                    }, 500);
                }

            } else {
                // Highlight correct and wrong answers
                buttons.forEach(btn => {
                    if (btn.textContent === gameState.currentQuestion.meaning) {
                        btn.classList.add('correct');
                    } else if (btn.textContent === answer || answer === null) {
                        btn.classList.add('wrong');
                    }
                });

                gameState.isWrong = true;

                // Calculate final score (last milestone)
                let finalScore = 0;
                for (let i = gameState.currentLevel - 1; i >= 0; i--) {
                    if (levelRewards[i].milestone) {
                        finalScore = parseInt(levelRewards[i].reward.replace(/,/g, ''));
                        break;
                    }
                }

                setTimeout(() => {
                    showFeedback(
                        '❌',
                        'Trả lời sai!',
                        `Đáp án đúng: "${gameState.currentQuestion.meaning}"\n\nBạn về mốc an toàn với ${finalScore.toLocaleString()} điểm\n\n"${gameState.currentQuestion.word}" - ${gameState.currentQuestion.meaning}\nVí dụ: ${gameState.currentQuestion.example}`
                    );
                }, 500);

                gameState.totalScore = finalScore;
            }

            // Update best score
            if (gameState.totalScore > gameState.bestScore) {
                gameState.bestScore = gameState.totalScore;
                saveGameState();
            }

            updateUI();
        }

        function showFeedback(icon, title, text) {
            document.getElementById('feedbackIcon').textContent = icon;
            document.getElementById('feedbackTitle').textContent = title;
            document.getElementById('feedbackText').textContent = text;
            document.getElementById('feedbackOverlay').style.display = 'flex';
        }

        function handleFeedbackAction() {
            document.getElementById('feedbackOverlay').style.display = 'none';
            
            if (gameState.isWrong || gameState.currentLevel === 10) {
                // Game over or won - restart
                document.getElementById('startScreen').style.display = 'flex';
                resetGame();
            } else {
                // Continue to next question
                gameState.currentLevel++;
                updateLadder();
                loadQuestion();
            }
        }

        function updateUI() {
            document.getElementById('currentLevel').textContent = gameState.currentLevel;
            document.getElementById('totalScore').textContent = gameState.totalScore.toLocaleString();
            document.getElementById('bestScore').textContent = gameState.bestScore.toLocaleString();
        }

        // ==================== START GAME ====================
        init();
    </script>
</body>
</html>
